[package]
name = "serial-split"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-software", "unstable-fontique-011"] }
serialport = { version = "4", default-features = false }
winreg = "0.55"
tray-icon = "0.26.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Security", "Win32_System_Registry", "Win32_Storage_FileSystem"] }

[profile.release]
debug = 0
strip = "debuginfo"
